<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <title>Will you be my valentine?</title>

    <style>

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        .card-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
}

.card {
    width: 60vw;
    margin: 0 auto;
    background-color: white;
    height: 60vh;
    border-radius: 8px;
    box-shadow: 0 0 20px #8b8b8b;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 50px;
    justify-content: center;
    flex-direction: column;
    position: relative;
}

body {
    background-color: lightpink;
}

h1 {
    margin: 0;
    text-align: center;
    font-family: "Dancing Script", cursive;
}

.buttons {
    display: flex;
    align-items: center;
    gap: 25px;
    margin: 0 auto;
    width: 100%;
    justify-content: center;
}

button {
    padding: 10px 20px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 8px;
    border: none;
    box-shadow: 0 0 5px #898989;
    transition: 0.3s ease;
    cursor: pointer;
}

button.yes {
    background-color: #48c448;
}

button.no {
    background-color: #c85252;
    color: white;
}

.image {
    width: 250px;
    position: absolute;
    z-index: 10;
    box-shadow: 0 0 20px #8b8b8b;
    background-color: white;
    pointer-events: none;
    transition: 0.3s ease;
    opacity: 0;
    left: 50%;
    height: fit-content;
    top: 50%;
    transform: translate(-50%, -50%);
}

.image.image1 {
    left: -108px;
    top: -80px;
    rotate: -33deg;
    opacity: 1;
    transform: none;
}

.image.image2 {
    right: -108px;
    left: unset;
    top: -80px;
    rotate: 33deg;
    opacity: 1;
    transform: none;
}

.image.image3 {
    left: -108px;
    bottom: -80px;
    top: unset;
    rotate: 33deg;
    opacity: 1;
    transform: none;
}

.image.image4 {
    right: -108px;
    left: unset;
    top: unset;
    bottom: -80px;
    rotate: -33deg;
    opacity: 1;
    transform: none;
}

    </style>

</head>
<body>
    
    <div class="card-container">
        <div class="card">
            <h1>Will you be my Valentine?</h1>
            <div class="buttons">
                <button class="yes">Yes</button>
                <button class="no">No</button>
            </div>
            <div class="image"><img src="celebrate.gif" alt="" width="100%"></div>
            <div class="image"><img src="celebrate2.gif" alt="" width="100%"></div>
            <div class="image"><img src="celebrate3.gif" alt="" width="100%"></div>
            <div class="image"><img src="celebrate4.gif" alt="" width="100%"></div>
        </div>
    </div>

    <script>

        const questions = [
    "Are you sure?",
    "Really sure?",
    "Pretty please?",
    "Please reconsider?",
    "Just think about it one more time?",
    "What if I ask nicely?",
    "Pretty pretty please?",
    "I even made a website for you",
    "You are really going to press no again?",
    "I think you misclicked",
    "That did not feel like the right choice",
    "Maybe try the other button?",
    "But I really like you",
    "Like... a lot a lot",
    "You are my favourite person",
    "Imagine how cute we would be though",
    "I promise snacks and cuddles",
    "Okay but seriously...",
    "Last chance?",
    "No :("
];

const yes = document.querySelector('button.yes');
const no = document.querySelector('button.no');
const gifs = document.querySelectorAll('.image');

let index = 0;
let hasCelebrated = false;

no.addEventListener('click', function() {
    if (index >= questions.length) return;

    let font_size = window.getComputedStyle(yes).fontSize;
    font_size = parseFloat(font_size);
    font_size += 10;
    yes.style.fontSize = `${font_size}px`;

    no.innerText = questions[index];
    index++;
})

function celebrate() {
    if (hasCelebrated) return;
    hasCelebrated = true;

    for (let i = 1; i < gifs.length + 1; i++) {
        const gif = gifs[i-1];
        gif.classList.add(`image${i}`);
    }

    const confettiCount = 120;
    const container = document.createElement("div");
    container.style.position = "fixed";
    container.style.top = "0";
    container.style.left = "0";
    container.style.width = "100%";
    container.style.height = "100%";
    container.style.pointerEvents = "none";
    container.style.overflow = "hidden";
    container.style.zIndex = "9999";
    document.body.appendChild(container);

    for (let i = 0; i < confettiCount; i++) {
        const piece = document.createElement("div");

        const size = Math.random() * 8 + 4;
        piece.style.position = "absolute";
        piece.style.width = size + "px";
        piece.style.height = size + "px";
        piece.style.left = "50vw";
        piece.style.bottom = "0px";
        piece.style.opacity = Math.random() + 0.5;

        const colors = ["#ff4d6d","#ffd166","#06d6a0","#118ab2","#ef476f","#f78c6b"];
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];

        const xSpread = Math.random() * 600 - 300;
        const yHeight = Math.random() * -600 - 200;
        const rotate = Math.random() * 720;

        const duration = Math.random() * 1200 + 1200;

        piece.animate(
            [
                { transform: `translate3d(0,0,0) rotate(0deg)` },
                { transform: `translate3d(${xSpread}px, ${yHeight}px, 0) rotate(${rotate}deg)` }
            ],
            {
                duration: duration,
                easing: "cubic-bezier(.17,.67,.83,.67)",
                fill: "forwards"
            }
        );

        container.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, duration);
    }

    setTimeout(() => {
        container.remove();
    }, 4000);
}

yes.addEventListener('click', function() {
    no.remove();
    yes.style.fontSize = '20px';
    yes.style.transform = 'scale(1.05)';
    setTimeout(() => yes.style.transform = 'scale(1)', 150);
    celebrate();
})


    </script>

</body>
</html>
